[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }, { triple = "x86_64-unknown-linux-gnu" }]
all-features = true

[advisories]
version = 2
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.95
include-dev = true
include-build = true
unused-allowed-license = "allow"
allow = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unlicense", "0BSD", "CC0-1.0", "BSL-1.0", "CDLA-Permissive-2.0"]

# Exact reviewed Tauri dependency exceptions; do not permit MPL globally.
exceptions = [
  { crate = "cssparser@=0.37.0", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros@=0.7.1", allow = ["MPL-2.0"] },
  { crate = "dtoa-short@=0.3.5", allow = ["MPL-2.0"] },
  { crate = "selectors@=0.38.0", allow = ["MPL-2.0"] },
  { crate = "option-ext@=0.2.0", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
