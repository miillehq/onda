[workspace]
members = ["crates/onda-core", "crates/onda-platform", "crates/onda-input", "crates/onda-asr", "crates/onda-cloud", "src-tauri"]
default-members = ["crates/onda-core"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

[profile.dev]
debug = 1
