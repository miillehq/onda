# L7: build the release bundles and install, launch and uninstall them the way a user does:
# NSIS on Windows, deb and AppImage on Linux, dmg on macOS, each on x64 and ARM. Tier 1 (Windows
# and Linux x64) must pass; the Tier 2 legs (ARM, macOS) report without blocking. Runs on master
# and on demand; pull requests stay within the 20-minute budget without it. A release publishes
# exactly the bundles one green run of this workflow built and tested (release.yml).
name: installers

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      upgrade_from:
        type: string
        default: ""
        description: Also verify a published release and upgrade it to these candidate artifacts
      windows_startup_run:
        type: string
        default: ""
        description: Diagnostic only. Sample the Windows x64 installer from this run on 30 fresh runners.

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}-${{ inputs.windows_startup_run != '' && 'startup' || 'packages' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  startup-sample:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_startup_run != ''
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/windows-startup-sample.yml
    with: { candidate_run: "${{ inputs.windows_startup_run }}" }

  published:
    if: github.event_name == 'workflow_dispatch' && inputs.upgrade_from != '' && inputs.windows_startup_run == ''
    needs: [windows, linux, macos]
    uses: ./.github/workflows/published-installers.yml
    permissions: { contents: read, actions: read }
    with:
      release_tag: ${{ inputs.upgrade_from }}
      candidate_run: ${{ format('{0}', github.run_id) }}

  windows:
    if: inputs.windows_startup_run == ''
    name: installers ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-2022, advisory: false, cache: windows-msvc-release }
          - { platform: windows-arm64, os: windows-11-arm, advisory: true, cache: windows-arm64-release }
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: ${{ matrix.cache }}
          cache-on-failure: true
      - name: Verify native toolchain
        run: |
          . ./scripts/toolchain.ps1
          "LIBCLANG_PATH=$env:LIBCLANG_PATH" >> $env:GITHUB_ENV
      - name: Install locked frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
      - name: Build the unsigned per-user NSIS installer
        id: build_installer
        run: ./scripts/build.ps1
      - name: Transcribe with the release workers (L3)
        uses: ./.github/actions/asr-golden
        with:
          workers: target/release
      - name: Silent installation and complete sidecar layout
        run: |
          $installer = Get-ChildItem -LiteralPath 'target/release/bundle/nsis' -Filter '*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'onda-install-smoke'
          $installation = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDirectory") -WindowStyle Hidden -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw 'Silent installation failed' }
          foreach ($binary in @('onda.exe', 'onda-input.exe', 'onda-asr-worker.exe', 'onda-asr-avx2-worker.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDirectory $binary))) { throw "Installed binary missing: $binary" }
          }
          $runtimeManifestPath = Join-Path $installDirectory 'licenses/Microsoft-runtime-manifest.json'
          if (-not (Test-Path -LiteralPath $runtimeManifestPath)) { throw 'Installed runtime provenance missing' }
          $runtimeManifest = Get-Content -LiteralPath $runtimeManifestPath -Raw | ConvertFrom-Json
          foreach ($runtimeFile in $runtimeManifest.files) {
            $dll = Join-Path $installDirectory $runtimeFile.name
            if (-not (Test-Path -LiteralPath $dll)) { throw "Installed runtime missing: $($runtimeFile.name)" }
            if ((Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne $runtimeFile.sha256) { throw 'Installed runtime hash mismatch' }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installDirectory 'licenses/MPL-source.zip'))) { throw 'Installed MPL source access missing' }
          $installedExecutables = @('onda.exe', 'onda-input.exe', 'onda-asr-worker.exe', 'onda-asr-avx2-worker.exe') | ForEach-Object { Join-Path $installDirectory $_ }
          $runtimeAudit = & './scripts/collect-msvc-runtime.ps1' -ExecutablePaths $installedExecutables
          $uninstaller = Join-Path $installDirectory 'uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw 'Uninstaller missing' }
          $uninstallation = Start-Process -FilePath $uninstaller -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($uninstallation.ExitCode -ne 0) { throw 'Silent uninstallation failed' }
      - name: Install, probe the workers, launch, observe and uninstall (L7)
        run: |
          $installer = Get-ChildItem -LiteralPath 'target/release/bundle/nsis' -Filter '*setup.exe' | Select-Object -First 1
          . ./scripts/installed-log.ps1
          $report = Invoke-InstalledAppCheck { ./scripts/installer-smoke.ps1 -InstallerPath $installer.FullName }
          $report | Select-Object status, cpuWorker, avx2Worker, startupSeconds, startupLogObserved, shell, helper, helperExitedOnParentClose, applicationDataPreserved, uninstallerExitCode | ConvertTo-Json -Depth 4
      - name: Upload the installed-app report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: installed-smoke-${{ matrix.platform }}
          path: .artifacts/installed-smoke/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload reviewable installer and notices
        if: "!cancelled() && steps.build_installer.conclusion == 'success'"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: onda-${{ matrix.platform }}-unsigned
          if-no-files-found: error
          # .artifacts holds the runtime manifest and the MPL source archive that
          # scripts/collect-mpl-source.ps1 built for the installer; the release publishes that archive.
          include-hidden-files: true
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sha256
            THIRD_PARTY_NOTICES.txt
            docs/dependency-inventory.json
            .artifacts/MPL-source.zip
            .artifacts/runtime/Microsoft-runtime-manifest.json

  linux:
    if: inputs.windows_startup_run == ''
    name: installers ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-24.04, advisory: false, cache: linux-gnu-release }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, advisory: true, cache: linux-arm64-release }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: ${{ matrix.cache }}
          cache-on-failure: true
      - name: Install Tauri, audio and packaging dependencies
        uses: ./.github/actions/install-ubuntu-packages
        with: { profile: packaging }
      - name: Install locked frontend
        run: npm ci
      - name: Build the deb and AppImage
        env:
          # linuxdeploy is itself an AppImage; runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: scripts/build.sh --bundles deb,appimage
      - name: Transcribe with the release workers (L3)
        uses: ./.github/actions/asr-golden
        with:
          workers: target/release
      - name: Start Xvfb
        run: |
          nohup Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 1 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
          [ -S /tmp/.X11-unix/X99 ] || { cat "$RUNNER_TEMP/xvfb.log"; exit 1; }
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Install, launch and remove the deb; launch the AppImage (L7)
        env:
          NO_AT_BRIDGE: "1"
        run: scripts/installer-test.sh
      - name: Upload the Linux packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: onda-${{ matrix.platform }}-unsigned
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  macos:
    if: inputs.windows_startup_run == ''
    name: installers ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Tier 2 (ADR 007) while the macOS port lands: reports without blocking.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, os: macos-latest }
          - { platform: macos-x64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: ${{ matrix.platform }}-release
          cache-on-failure: true
          cache-bin: false
      - name: Install locked frontend
        run: npm ci
      - name: Build the app and dmg (unsigned)
        run: scripts/build.sh --bundles app,dmg
      - name: Transcribe with the release workers (L3)
        uses: ./.github/actions/asr-golden
        with:
          workers: target/release
      - name: Mount, copy, launch and remove the app (L7)
        run: scripts/installer-test.sh
      - name: Upload the disk image
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: onda-${{ matrix.platform }}-unsigned
          if-no-files-found: error
          path: target/release/bundle/dmg/*.dmg

  distributions:
    name: distributions ${{ matrix.distribution }}
    needs: [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Tier 3 (ADR 007): advisory checks that the Linux packages' libraries resolve elsewhere.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distribution: debian, image: "debian:trixie" }
          - { distribution: fedora, image: "fedora:42" }
          - { distribution: arch, image: "archlinux:latest" }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: onda-linux-x64-unsigned
          path: packages
      - name: Resolve dependencies and launch the candidate in the distribution (L8)
        env:
          IMAGE: ${{ matrix.image }}
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          docker run --rm -v "$PWD/packages:/packages:ro" -v "$PWD/scripts:/onda-check:ro" -e DISTRIBUTION "$IMAGE" bash /onda-check/distribution-test.sh
