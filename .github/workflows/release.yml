# A `v*` tag on master publishes a GitHub release with exactly the bundles that one green
# `installers` run built and installer-tested for the tagged commit, once the tag, package.json,
# tauri.conf.json and the Cargo workspace agree on the version. 0.x versions are pre-releases.
# A manual run builds a reviewable Windows candidate instead, optionally with the Vulkan worker
# or signed updater artifacts; it publishes nothing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      with_vulkan:
        description: Include the separate Vulkan worker; hosted runners cannot certify GPU inference
        type: boolean
        default: false
      signed_updates:
        description: Require updater signing secrets and produce signed update artifacts
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    name: gate (one version, on master, installers green)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.installers.outputs.run }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: The tag, the app and the crates carry one version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "tag $tag; package.json $package; tauri.conf.json $tauri; Cargo workspace $cargo"
          if [ "$tag" != "$package" ] || [ "$tag" != "$tauri" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::the tag and the versions in package.json, tauri.conf.json and Cargo.toml differ"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: The tagged commit is on master
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::$GITHUB_SHA is not on master"; exit 1; }
      - name: Every installers job passed on this commit
        id: installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow installers.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId -q '.[0].databaseId')
          [ -n "$run" ] || { echo "::error::no successful installers run for $GITHUB_SHA"; exit 1; }
          # Tier 2 legs report without failing their run, so each job is checked by name.
          gh run view "$run" --repo "$GITHUB_REPOSITORY" --json jobs -q '.jobs[] | "\(.conclusion) \(.name)"' | tee jobs.txt
          for platform in windows-x64 windows-arm64 linux-x64 linux-arm64 macos-arm64 macos-x64; do
            grep -qx "success installers $platform" jobs.txt || { echo "::error::installers $platform did not pass in run $run"; exit 1; }
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"

  publish:
    name: publish the release
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Collect the tested bundles and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.gate.outputs.run }}
        run: |
          mkdir -p downloads assets
          for platform in windows-x64 windows-arm64 linux-x64 linux-arm64 macos-arm64 macos-x64; do
            gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name "onda-$platform-unsigned" --dir "downloads/$platform"
          done
          find downloads -type f \( -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) -exec cp {} assets/ \;
          count=$(ls assets | wc -l)
          [ "$count" -eq 8 ] || { ls -la assets; echo "::error::expected 8 bundles, found $count"; exit 1; }
          cp downloads/windows-x64/THIRD_PARTY_NOTICES.txt assets/
          cp "$(find downloads/windows-x64 -name onda-mpl-source.zip | head -1)" assets/
          (cd assets && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Notes from the changelog
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          RUN: ${{ needs.gate.outputs.run }}
        run: |
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          {
            echo
            echo "---"
            echo
            echo "Every installer here was built, installed, launched and removed on its own platform in [installers run $RUN]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN). Check a download against \`SHA256SUMS.txt\`."
          } >> notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          prerelease=()
          case "$VERSION" in 0.*|*-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Onda $VERSION" --notes-file notes.md "${prerelease[@]}" assets/*

  candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      ONDA_UPDATE_ENDPOINT: ${{ vars.ONDA_UPDATE_ENDPOINT }}
      ONDA_UPDATE_PUBLIC_KEY: ${{ vars.ONDA_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: windows-release-cpu-generic
      - name: Map short build path and verify native toolchain
        run: |
          subst R: $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Short build path mapping failed' }
          Set-Location -LiteralPath 'R:\'
          . ./scripts/toolchain.ps1
          "LIBCLANG_PATH=$env:LIBCLANG_PATH" >> $env:GITHUB_ENV
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
      - name: Install verified Vulkan SDK when requested
        if: ${{ inputs.with_vulkan }}
        run: |
          $sdkVersion = '1.4.363.0'
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          $expected = Invoke-RestMethod -Uri "https://sdk.lunarg.com/sdk/sha/$sdkVersion/windows/vulkan_sdk.exe.json"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$sdkVersion/windows/vulkan_sdk.exe" -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected.sha) { throw 'Vulkan SDK checksum mismatch' }
          if ((Get-AuthenticodeSignature -LiteralPath $installer).Status -ne 'Valid') { throw 'Vulkan SDK Authenticode validation failed' }
          $installation = Start-Process -FilePath $installer -ArgumentList @('--root', 'C:\vk', '--accept-licenses', '--default-answer', '--confirm-command', 'install', 'copy_only=1') -WindowStyle Hidden -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw 'Vulkan SDK installation failed' }
          'VULKAN_SDK=C:\vk' >> $env:GITHUB_ENV
          'C:\vk\Bin' >> $env:GITHUB_PATH
      - name: Prepare helpers and verify release candidate
        run: |
          Set-Location -LiteralPath 'R:\'
          ./scripts/prepare.ps1
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed' }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { throw 'Workspace tests failed' }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Workspace clippy failed' }
          npm run contracts:check
          if ($LASTEXITCODE -ne 0) { throw 'Generated contract drift' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
          npm run quality
          if ($LASTEXITCODE -ne 0) { throw 'Deterministic quality regression' }
          cargo install cargo-deny --version 0.19.7 --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo-deny installation failed' }
          cargo deny --locked check licenses advisories sources
          if ($LASTEXITCODE -ne 0) { throw 'Dependency policy failed' }
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency advisory failed' }
      - name: Build requested bundle without publishing
        env:
          BUILD_VULKAN: ${{ inputs.with_vulkan }}
          SIGNED_UPDATES: ${{ inputs.signed_updates }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          Set-Location -LiteralPath 'R:\'
          $vulkan = $env:BUILD_VULKAN -eq 'true'
          $signed = $env:SIGNED_UPDATES -eq 'true'
          ./scripts/build.ps1 -WithVulkan:$vulkan -SignedUpdates:$signed
      - name: Bundle exact MPL source and checksums
        run: |
          Set-Location -LiteralPath 'R:\'
          $metadata = (& cargo metadata --locked --format-version 1) | ConvertFrom-Json
          $sourceRoot = Join-Path $PWD '.artifacts/mpl-source'
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          foreach ($package in $metadata.packages | Where-Object license -EQ 'MPL-2.0') {
            Copy-Item -LiteralPath (Split-Path -Parent $package.manifest_path) -Destination (Join-Path $sourceRoot "$($package.name)-$($package.version)") -Recurse
          }
          Compress-Archive -LiteralPath $sourceRoot -DestinationPath '.artifacts/onda-mpl-source.zip' -Force
          $digest = (Get-FileHash -LiteralPath '.artifacts/onda-mpl-source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  onda-mpl-source.zip" | Set-Content -LiteralPath '.artifacts/onda-mpl-source.zip.sha256' -Encoding ascii
      - name: Upload candidate for explicit release review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: onda-windows-x64-candidate-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*
            THIRD_PARTY_NOTICES.txt
            docs/dependency-inventory.json
            .artifacts/onda-mpl-source.zip
            .artifacts/onda-mpl-source.zip.sha256
            .artifacts/MPL-source.zip
            .artifacts/runtime/Microsoft-runtime-manifest.json
