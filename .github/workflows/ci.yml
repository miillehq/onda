# Every pull request and every push to master, in tiers (docs/adr/007-platform-support.md):
#   tier1 windows-x64, tier1 linux-x64   required: L0 lint, L1/L3 cargo test, L2 contracts,
#                                         quality fixtures; real-model ASR on Windows;
#                                         WebKitGTK smoke on Linux; real-shell journeys (L6).
#   policy                               required: cargo-deny and npm audit, once.
#   tier2 <platform>                     advisory while macOS and ARM are being ported:
#                                         reports how far each platform builds and tests.
# Installers (L7) run in installers.yml on master and releases.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  windows:
    name: tier1 windows-x64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: windows-msvc-cpu-generic
          cache-on-failure: true
      - name: Verify native toolchain
        run: |
          . ./scripts/toolchain.ps1
          "LIBCLANG_PATH=$env:LIBCLANG_PATH" >> $env:GITHUB_ENV
          cargo --version
          cmake --version
      - name: Install locked frontend and prepare real workers
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          ./scripts/prepare.ps1
      - name: L0 format, types and lint
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust format check failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript or Vite build failed' }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Workspace clippy failed' }
          cargo clippy --locked -p onda-asr --features native-asr --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native worker clippy failed' }
      - name: L2 generated contracts
        run: |
          npm run contracts:check
          if ($LASTEXITCODE -ne 0) { throw 'Generated contract drift' }
      - name: L1 and L3 workspace tests
        run: |
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { throw 'Workspace tests failed' }
      - name: Quality fixtures
        run: |
          npm run quality
          if ($LASTEXITCODE -ne 0) { throw 'Deterministic quality regression' }
      - name: Cache pinned golden model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .artifacts/ci-models
          key: whisper-tiny-en-921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f
      - name: L3 real-model transcription, GPU fallback and cancellation
        run: |
          $modelDirectory = Join-Path $PWD '.artifacts/ci-models'
          $installationJson = (& cargo run --locked -p onda-asr --bin onda-asr-benchmark -- download $modelDirectory whisper-tiny-en) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Verified model download failed' }
          $installation = $installationJson | ConvertFrom-Json
          $env:ONDA_ASR_TEST_MODEL = $installation.path
          $env:ONDA_ASR_WORKER_DIR = Join-Path $PWD 'target/debug'
          cargo test --locked -p onda-asr --test golden -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Real ASR golden tests failed' }
      - name: L6 real-shell journeys
        run: |
          npx tsc -p tests/e2e/tsconfig.json --noEmit
          if ($LASTEXITCODE -ne 0) { throw 'E2E suite type check failed' }
          npm run build:e2e
          if ($LASTEXITCODE -ne 0) { throw 'Debug e2e build failed' }
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { throw 'Real-shell tests failed' }
      - name: Upload real-shell screenshots and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-windows-x64
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: tier1 linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: linux-gnu
          cache-on-failure: true
      - name: Install Tauri, audio and test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev libxdo-dev \
            libdbus-1-dev cmake clang libclang-dev pkg-config xvfb dbus
      - name: Install locked frontend and prepare Linux speech workers
        run: |
          npm ci
          scripts/prepare.sh
      - name: L0 format, types and lint
        run: |
          cargo fmt --all --check
          npm run build
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: L2 generated contracts
        run: npm run contracts:check
      - name: L1 and L3 workspace tests
        run: cargo test --locked --workspace
      - name: Quality fixtures
        run: npm run quality
      - name: L6 native smoke in WebKitGTK
        run: |
          cargo build --locked -p onda-app --bin onda
          npm run dev > "$RUNNER_TEMP/vite.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:1420/ > /dev/null && break; sleep 1; done
          mkdir -p "$RUNNER_TEMP/smoke"
          timeout 300 dbus-run-session -- xvfb-run -a env ONDA_SMOKE_DIRECTORY="$RUNNER_TEMP/smoke" target/debug/onda
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print("\n".join(r["checks"])); sys.exit(0 if r["passed"] else 1)' "$RUNNER_TEMP/smoke/report.json"
      - name: L6 real-shell journeys
        env:
          NO_AT_BRIDGE: "1"
        run: |
          npx tsc -p tests/e2e/tsconfig.json --noEmit
          npm run build:e2e
          dbus-run-session -- xvfb-run -a npm run test:e2e
      - name: Upload real-shell screenshots and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-linux-x64
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 7

  policy:
    name: dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: policy
      - name: Rust licenses, advisories and sources
        run: |
          cargo install cargo-deny --version 0.19.7 --locked
          cargo deny --locked check licenses advisories sources
      - name: Frontend advisories
        # Shipped dependencies gate the build. Test tooling (WebdriverIO 9, pinned by the Tauri
        # service) is reported, not gated, because it never ships: PLAN.md, slice 3 ruling.
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high || echo "::warning::High advisories in test-only dependencies (PLAN.md slice 3)"

  tier2:
    name: tier2 ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, os: macos-latest }
          - { platform: macos-x64, os: macos-15-intel }
          - { platform: windows-arm64, os: windows-11-arm }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: ${{ matrix.platform }}
          cache-on-failure: true
          cache-bin: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev libxdo-dev \
            libdbus-1-dev cmake clang libclang-dev pkg-config xvfb dbus
      - name: Windows native toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./scripts/toolchain.ps1
          "LIBCLANG_PATH=$env:LIBCLANG_PATH" >> $env:GITHUB_ENV
      - name: Crates without the app shell (L1, L3)
        run: cargo test --locked --workspace --exclude onda-app
      - name: Frontend (L0)
        if: always()
        run: |
          npm ci
          npm run build
      - name: Speech and shortcut workers
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then pwsh -NoProfile -File scripts/prepare.ps1; else scripts/prepare.sh; fi
      - name: App shell (L1)
        if: always()
        run: cargo test --locked -p onda-app
