# Every pull request and every push to master, in tiers (docs/adr/007-platform-support.md):
#   tier1 windows-x64, tier1 linux-x64   required: L0 lint, L1/L3 cargo test, L2 contracts,
#                                         quality fixtures; real-model ASR on Windows;
#                                         native smoke in WebView2 and WebKitGTK and the
#                                         real-shell journeys (L6).
#   ui <platform>                        L4/L5: Playwright on chromium and webkit against the
#                                         labelled mock; required on Windows and Linux.
#   policy                               required: cargo-deny and npm audit, once.
#   tier2 <platform>                     advisory while macOS and ARM are being ported:
#                                         reports how far each platform builds and tests.
# Installers (L7) run in installers.yml on master and releases.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  windows:
    name: tier1 windows-x64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: windows-msvc-cpu-generic
          cache-on-failure: true
      - name: Verify native toolchain
        run: |
          . ./scripts/toolchain.ps1
          "LIBCLANG_PATH=$env:LIBCLANG_PATH" >> $env:GITHUB_ENV
          cargo --version
          cmake --version
      - name: Install locked frontend and prepare real workers
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          ./scripts/prepare.ps1
      - name: L0 format, types and lint
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust format check failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript or Vite build failed' }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Workspace clippy failed' }
          cargo clippy --locked -p onda-asr --features native-asr --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native worker clippy failed' }
      - name: L2 generated contracts and the mock against the contract examples
        run: |
          npm run contracts:check
          if ($LASTEXITCODE -ne 0) { throw 'Generated contract drift' }
          npm run test:unit
          if ($LASTEXITCODE -ne 0) { throw 'Unit or contract tests failed' }
      - name: L1 and L3 workspace tests
        run: |
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { throw 'Workspace tests failed' }
      - name: Quality fixtures
        run: |
          npm run quality
          if ($LASTEXITCODE -ne 0) { throw 'Deterministic quality regression' }
      - name: L3 real-model transcription, GPU fallback and cancellation
        uses: ./.github/actions/asr-golden
        with:
          workers: target/debug
      - name: L6 native smoke in WebView2
        # L6 may retry once (AGENTS.md, rule 5): a timeout retries, a failed check fails at once.
        # Each retry is a data point for https://github.com/miillehq/onda/issues/25.
        run: |
          cargo build --locked -p onda-app --bin onda
          if ($LASTEXITCODE -ne 0) { throw 'Debug desktop build failed' }
          try {
            ./scripts/smoke.ps1 -SkipBuild -WithDictationFixture -FixtureModelDirectory .artifacts/ci-models
          } catch {
            $first = $_.Exception.Message
            if ($first -notlike 'Hidden desktop IPC smoke timed out.*') { throw }
            Write-Output $first
            $annotation = $first.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::warning title=WebView2 smoke timed out and was retried::Add this run to https://github.com/miillehq/onda/issues/25%0A$annotation"
            ./scripts/smoke.ps1 -SkipBuild -WithDictationFixture -FixtureModelDirectory .artifacts/ci-models
          }
      - name: L6 real-shell journeys
        run: |
          npx tsc -p tests/e2e/tsconfig.json --noEmit
          if ($LASTEXITCODE -ne 0) { throw 'E2E suite type check failed' }
          npm run build:e2e
          if ($LASTEXITCODE -ne 0) { throw 'Debug e2e build failed' }
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { throw 'Real-shell tests failed' }
      - name: Upload real-shell screenshots and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-windows-x64
          path: |
            artifacts/e2e/*.png
            artifacts/e2e/*.html
            artifacts/e2e/logs
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: tier1 linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: linux-gnu
          cache-on-failure: true
      - name: Install Tauri, audio and test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev libxdo-dev \
            libdbus-1-dev cmake clang libclang-dev pkg-config xvfb dbus gnome-keyring libglib2.0-bin
      - name: Install locked frontend and prepare Linux speech workers
        run: |
          npm ci
          scripts/prepare.sh
      - name: L0 format, types and lint
        run: |
          cargo fmt --all --check
          npm run build
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: L2 generated contracts and the mock against the contract examples
        run: |
          npm run contracts:check
          npm run test:unit
      - name: L1 and L3 workspace tests
        run: cargo test --locked --workspace
      - name: Synthetic account and key storage round trips (L3)
        env:
          DISPOSABLE_RUNNER: ${{ runner.environment }}
        run: bash scripts/credential-fixtures.sh
      - name: Isolated X11 clipboard round trip
        run: xvfb-run -a env ONDA_TEST_X11=isolated cargo test --locked -p onda-platform --lib isolated_x11_keeps_rich_content -- --ignored --test-threads=1
      - name: Quality fixtures
        run: npm run quality
      - name: L6 native smoke in WebKitGTK
        run: |
          cargo build --locked -p onda-app --bin onda
          export ONDA_SMOKE_DIRECTORY
          ONDA_SMOKE_DIRECTORY=$(mktemp -d "$RUNNER_TEMP/onda-smoke.XXXXXXXX")
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 1420 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            kill -0 "$server" || { cat "$RUNNER_TEMP/vite.log"; exit 1; }
            if curl -fsSI http://127.0.0.1:1420/ | tr -d '\r' | grep -Fxiq "X-Onda-Smoke-Run: ${ONDA_SMOKE_DIRECTORY##*/}"; then break; fi
            sleep 1
          done
          curl -fsSI http://127.0.0.1:1420/ | tr -d '\r' | grep -Fxiq "X-Onda-Smoke-Run: ${ONDA_SMOKE_DIRECTORY##*/}"
          timeout 300 dbus-run-session -- xvfb-run -a target/debug/onda
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print("\n".join(r["checks"])); sys.exit(0 if r["passed"] else 1)' "$ONDA_SMOKE_DIRECTORY/report.json"
      - name: L6 real-shell journeys
        env:
          NO_AT_BRIDGE: "1"
        run: |
          npx tsc -p tests/e2e/tsconfig.json --noEmit
          npm run build:e2e
          dbus-run-session -- xvfb-run -a npm run test:e2e
      - name: Upload real-shell screenshots and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-linux-x64
          path: |
            artifacts/e2e/*.png
            artifacts/e2e/*.html
            artifacts/e2e/logs
          if-no-files-found: ignore
          retention-days: 7

  ui:
    name: ui ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # macOS is Tier 2 (ADR 007) until the port lands; its browser suite reports without blocking.
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-2022, advisory: false }
          - { platform: linux-x64, os: ubuntu-24.04, advisory: false }
          - { platform: macos-arm64, os: macos-latest, advisory: true }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Type-check the browser suite
        run: npx tsc -p tests/ui/tsconfig.json --noEmit
      - name: Linux browser system dependencies
        if: runner.os == 'Linux'
        run: |
          printf '%s\n' 'DPkg::Lock::Timeout "180";' > "$RUNNER_TEMP/browser-apt.conf"
          sudo env PATH="$PATH" APT_CONFIG="$RUNNER_TEMP/browser-apt.conf" DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a node node_modules/playwright/cli.js install-deps chromium webkit
      - name: Playwright browsers
        if: runner.os == 'Linux'
        run: npx --no-install playwright install chromium webkit
      - name: Playwright browsers and host dependencies
        if: runner.os != 'Linux'
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: L4 and L5 against the labelled mock (chromium and webkit)
        env:
          CI: "1"
        run: npm run test:ui
      - name: Verify the distributable UI without a desktop bridge
        run: npm run test:production-ui
      - name: Upload the report and any diffs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ui-${{ matrix.platform }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  screenshots:
    name: real-shell contact sheet
    if: always() && !cancelled()
    needs: [windows, linux, tier2, intel-desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24" }
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with: { pattern: "e2e-*", path: artifacts/platforms }
      - run: node scripts/contact-sheet.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with: { name: shell-contact-sheet, path: artifacts/contact-sheet.html, retention-days: 7 }

  source:
    name: source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with: { toolchain: "1.95.0" }
      - run: npm ci
      - run: npm run lint:source
      - run: npm run test:tooling

  policy:
    name: dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: policy
      - name: Rust licenses, advisories and sources
        run: |
          cargo install cargo-deny --version 0.19.7 --locked
          cargo deny --locked check licenses advisories sources
      - name: Frontend advisories
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

  tier2:
    name: ${{ matrix.platform == 'macos-x64' && 'native libraries macos-x64' || format('tier2 {0}', matrix.platform) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, os: macos-latest }
          - { platform: macos-x64, os: macos-15-intel }
          - { platform: windows-arm64, os: windows-11-arm }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.platform != 'macos-x64'
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: ${{ matrix.platform }}
          cache-on-failure: true
          cache-bin: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev libxdo-dev \
            libdbus-1-dev cmake clang libclang-dev pkg-config xvfb dbus gnome-keyring libglib2.0-bin
      - name: Windows native toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./scripts/toolchain.ps1
          "LIBCLANG_PATH=$env:LIBCLANG_PATH" >> $env:GITHUB_ENV
      - name: Crates without the app shell (L1, L3)
        run: cargo test --locked --workspace --exclude onda-app
      - name: Synthetic account and key storage round trips (L3)
        if: runner.os != 'Windows'
        env:
          DISPOSABLE_RUNNER: ${{ runner.environment }}
        run: bash scripts/credential-fixtures.sh
      - name: Isolated X11 clipboard round trip
        if: runner.os == 'Linux'
        run: xvfb-run -a env ONDA_TEST_X11=isolated cargo test --locked -p onda-platform --lib isolated_x11_keeps_rich_content -- --ignored --test-threads=1
      - name: Frontend (L0)
        if: always() && matrix.platform != 'macos-x64'
        run: |
          npm ci
          npm run build
      - name: Speech and shortcut workers
        if: always() && matrix.platform != 'macos-x64'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then pwsh -NoProfile -File scripts/prepare.ps1; else scripts/prepare.sh; fi
      - name: App shell (L1)
        if: always() && matrix.platform != 'macos-x64'
        run: cargo test --locked -p onda-app
      - name: Real-shell journeys (L6)
        if: always() && matrix.platform != 'macos-x64'
        shell: bash
        env:
          NO_AT_BRIDGE: "1"
        run: |
          npm run build:e2e
          if [ "$RUNNER_OS" = "Linux" ]; then dbus-run-session -- xvfb-run -a npm run test:e2e; else npm run test:e2e; fi
      - name: Upload real-shell screenshots and logs
        if: always() && matrix.platform != 'macos-x64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-${{ matrix.platform }}
          path: |
            artifacts/e2e/*.png
            artifacts/e2e/*.html
            artifacts/e2e/logs
          if-no-files-found: ignore
          retention-days: 7

  intel-workers:
    name: debug workers macos-x64
    runs-on: macos-15-intel
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with: { toolchain: "1.95.0" }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: macos-x64-workers
          cache-bin: false
          workspaces: |
            . -> target
            . -> target/avx2
      - name: Build the native workers
        run: |
          scripts/prepare.sh
          tar -czf "$RUNNER_TEMP/intel-workers.tar.gz" src-tauri/binaries
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: intel-debug-workers
          path: ${{ runner.temp }}/intel-workers.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  intel-desktop:
    name: ${{ matrix.name }}
    needs: intel-workers
    runs-on: macos-15-intel
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: app tests macos-x64, lane: app }
          - { name: tier2 macos-x64, lane: webview }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", cache: npm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with: { toolchain: "1.95.0" }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: macos-x64-${{ matrix.lane }}
          cache-bin: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with: { name: intel-debug-workers, path: "${{ runner.temp }}" }
      - name: Prepare the matching commit's desktop dependencies
        run: |
          tar -xzf "$RUNNER_TEMP/intel-workers.tar.gz"
          npm ci
      - name: Frontend (L0)
        if: matrix.lane == 'app'
        run: npm run build
      - name: App shell (L1)
        if: matrix.lane == 'app'
        run: cargo test --locked -p onda-app
      - name: Real-shell journeys (L6)
        if: matrix.lane == 'webview'
        run: |
          npm run build:e2e
          npm run test:e2e
      - name: Upload real-shell screenshots and logs
        if: always() && matrix.lane == 'webview'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-macos-x64
          path: |
            artifacts/e2e/*.png
            artifacts/e2e/*.html
            artifacts/e2e/logs
          if-no-files-found: error
          retention-days: 7
