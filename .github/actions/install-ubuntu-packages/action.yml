name: Install Ubuntu dependencies
description: Reuse checked Debian package archives while installing the runner's normal dependencies.
inputs:
  profile:
    description: desktop, browser or packaging
    required: true
runs:
  using: composite
  steps:
    - name: Prepare the APT archive directory
      id: archive
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        case "$PROFILE" in desktop|browser|packaging) ;; *) echo "Unknown Ubuntu dependency profile" >&2; exit 2 ;; esac
        . /etc/os-release
        echo "system=$ID-$VERSION_ID-$(dpkg --print-architecture)" >> "$GITHUB_OUTPUT"
        echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
        mkdir -p "$RUNNER_TEMP/onda-apt-archives"
        cat > "$RUNNER_TEMP/onda-apt.conf" <<EOF
        Dir::Cache::archives "$RUNNER_TEMP/onda-apt-archives";
        APT::Keep-Downloaded-Packages "true";
        Binary::apt-get::APT::Keep-Downloaded-Packages "true";
        DPkg::Lock::Timeout "180";
        EOF
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/onda-apt-archives/*.deb
        key: onda-apt-v1-${{ steps.archive.outputs.system }}-${{ inputs.profile }}-${{ steps.archive.outputs.week }}-${{ hashFiles('.github/actions/install-ubuntu-packages/action.yml', 'package-lock.json') }}
        restore-keys: onda-apt-v1-${{ steps.archive.outputs.system }}-${{ inputs.profile }}-
    - name: Install packages from the current Ubuntu index
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/onda-apt-archives"
        elevated=(sudo env "APT_CONFIG=$RUNNER_TEMP/onda-apt.conf" DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a)
        restored=false
        if compgen -G "$archive/*.deb" > /dev/null; then restored=true; fi
        if [[ "$PROFILE" != browser || "$restored" == true ]]; then
          "${elevated[@]}" apt-get update
        fi
        if [[ "$restored" == true ]]; then
          node "$GITHUB_WORKSPACE/scripts/verify-apt-archives.mjs"
        fi
        if [[ "$PROFILE" == browser ]]; then
          "${elevated[@]}" "PATH=$PATH" node node_modules/playwright/cli.js install-deps chromium webkit
        else
          packages=(libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
            libssl-dev libasound2-dev libxdo-dev libdbus-1-dev cmake clang libclang-dev pkg-config xvfb dbus)
          if [[ "$PROFILE" == desktop ]]; then packages+=(gnome-keyring libglib2.0-bin); else packages+=(patchelf file); fi
          "${elevated[@]}" apt-get install -y --no-install-recommends "${packages[@]}"
        fi
        if [[ "$restored" == false ]]; then
          node "$GITHUB_WORKSPACE/scripts/verify-apt-archives.mjs"
        fi
        count=$(find "$archive" -maxdepth 1 -type f -name '*.deb' -printf . | wc -c)
        echo "$count package archives available for the next runner."
