[package]
name = "onda-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "onda"
description = "Windows local-first dictation and optional ChatGPT text tools"

[lib]
name = "onda_app"
path = "src/lib.rs"

[[bin]]
name = "onda"
path = "src/main.rs"

[[bin]]
name = "onda-api-contracts"
path = "src/bin/contracts.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
onda-core = { path = "../crates/onda-core" }
onda-platform = { path = "../crates/onda-platform" }
onda-input = { path = "../crates/onda-input" }
onda-asr = { path = "../crates/onda-asr" }
onda-cloud = { path = "../crates/onda-cloud" }
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-updater = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
hound = "3.5"

[dev-dependencies]
tempfile = "3"
