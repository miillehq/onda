[package]
name = "onda-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "onda"
description = "Local-first dictation for Windows and Linux with optional AI text tools"

[lib]
name = "onda_app"
path = "src/lib.rs"

[[bin]]
name = "onda"
path = "src/main.rs"

# An example rather than a binary: the installer bundles every binary of this package.
[[example]]
name = "onda-api-contracts"
path = "examples/api_contracts.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
onda-core = { path = "../crates/onda-core" }
onda-platform = { path = "../crates/onda-platform" }
onda-input = { path = "../crates/onda-input" }
onda-asr = { path = "../crates/onda-asr" }
onda-cloud = { path = "../crates/onda-cloud" }
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4"
# Without the default `zip` feature: Onda ships v2 updater artifacts (installers on Windows and
# Linux, .app.tar.gz on macOS, whose tar and flate2 stay enabled), so nothing is ever unzipped.
tauri-plugin-updater = { version = "2.10", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-dialog = "2.4"
base64 = "0.22.1"
zeroize = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
hound = "3.5"
# Real-shell tests (L6): WebdriverIO's plugins, compiled only with `--features e2e` and
# registered only in debug builds (see lib.rs). Release binaries never contain a WebDriver server.
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# macOS: dictation shortcuts are system hotkeys registered in the app (press and release),
# so they need no Accessibility or Input Monitoring permission.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3"
