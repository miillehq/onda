[package]
name = "eagle-input"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Isolated Windows push-to-talk shortcut helper and supervisor"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_StationsAndDesktops"] }

[[bin]]
name = "eagle-input"
path = "src/main.rs"
