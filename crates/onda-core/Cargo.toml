[package]
name = "onda-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Content-private domain, persistence and contracts for Onda dictation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.41", features = ["bundled"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
aho-corasick = "1.1"
regex = "1.12"
strsim = "0.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde_json = "1"

[[bin]]
name = "onda-contracts"
path = "src/bin/contracts.rs"

[[bin]]
name = "onda-quality"
path = "src/bin/quality.rs"
