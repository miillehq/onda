[package]
name = "onda-input"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Isolated push-to-talk shortcut helper (Windows keyboard hook, Linux shortcuts portal) and supervisor"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
onda-platform = { path = "../onda-platform" }
zbus = "5.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_StationsAndDesktops"] }

[dev-dependencies]
# Checks that every accelerator name parses as macOS will register it.
global-hotkey = "0.8"

[[bin]]
name = "onda-input"
path = "src/main.rs"
