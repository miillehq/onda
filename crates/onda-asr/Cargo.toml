[package]
name = "onda-asr"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Isolated local speech recognition and verified model assets for Onda"

[features]
default = []
native-asr = ["dep:whisper-rs"]
vulkan = ["native-asr", "whisper-rs/vulkan"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "net", "process", "sync", "time", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
num_cpus = "1.17"
whisper-rs = { version = "=0.16.0", optional = true, default-features = false }
hound = "3.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = "3.23"

[[bin]]
name = "onda-asr-worker"
path = "src/bin/worker.rs"
required-features = ["native-asr"]

[[bin]]
name = "onda-asr-benchmark"
path = "src/bin/benchmark.rs"
