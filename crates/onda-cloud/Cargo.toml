[package]
name = "onda-cloud"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Sign in with ChatGPT and bounded Responses streaming"

[dependencies]
base64 = "0.22.1"
fs2 = "0.4.3"
futures-util = "0.3.31"
jsonwebtoken = "9.3.1"
rand = "0.8.5"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0"
tokio = { version = "1.48", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
tokio-util = "0.7"
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
webbrowser = "1.0"
zeroize = { version = "1.8", features = ["derive"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
onda-platform = { path = "../onda-platform" }
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
onda-platform = { path = "../onda-platform" }
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1.48", features = ["net", "io-util", "rt", "macros"] }

